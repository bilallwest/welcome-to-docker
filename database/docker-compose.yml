services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: revalinow-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:?Set SA_PASSWORD in database/.env}
      TZ: Europe/Amsterdam
    ports:
      - "1433:1433"
    volumes:
      - revalinow-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

volumes:
  revalinow-data:
